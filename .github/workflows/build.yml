name: build

# 打包桌面壳（tauri2/）并发布 Release
#   macOS   → universal（Apple Silicon + Intel）：.dmg + .app.zip
#   Windows → x86_64：.exe（NSIS）+ .msi
#
# 触发条件：
#   1. push 到 main，且改动涉及 tauri2/ → 构建 + 自动创建/更新 GitHub Release
#      （只改业务代码、文档等 tauri2/ 之外的内容不触发）
#   2. 手动触发（Actions 页面 Run workflow），默认同样发版，可取消勾选只出包
#
# 版本与标签：标签取 shell-v + tauri2/package.json 的 version。
# pre-commit 钩子在每次提交时递增该版本号，所以一次 tauri2 提交 = 一个 Release。
# 注意：workflow 用 GITHUB_TOKEN 创建的标签/Release 不会再次触发工作流，不存在循环。

on:
  workflow_dispatch:
    inputs:
      release:
        description: '构建完成后创建/更新 GitHub Release'
        type: boolean
        default: true
      tag:
        description: 'Release 标签（留空则用 shell-v + tauri2 版本号）'
        type: string
        required: false
  push:
    branches:
      - main
    paths:
      - 'tauri2/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundles: ''
            artifact: macos-universal
          - platform: windows-latest
            args: ''
            # NSIS 原生支持 Unicode，装中文产品名没问题，先保底出 exe 安装包
            bundles: '--bundles nsis'
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri2/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 打通用包需要两个 target；Windows 用默认 host target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tauri2/src-tauri -> target'

      - name: Install frontend deps
        working-directory: tauri2
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: tauri2
        env:
          RUST_BACKTRACE: 1
        run: pnpm tauri build ${{ matrix.args }} ${{ matrix.bundles }}

      # MSI 由 WiX 生成，对非 Latin 字符敏感（需要 zh-CN 代码页）。
      # 失败不阻塞：exe 安装包已由上一步产出，这里只是尽量多给一个 msi。
      - name: Build MSI (best effort)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        working-directory: tauri2
        env:
          RUST_BACKTRACE: 1
        run: pnpm tauri build --bundles msi

      - name: Collect bundles
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p out

          # 只从 bundle 产物目录取件，避免把裸二进制 / build script 之类的中间 exe 混进发布包
          find tauri2/src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;

          # macOS 的 .app 是目录，压成 zip 便于分发
          find tauri2/src-tauri/target -maxdepth 6 -type d -path '*/release/bundle/macos/*.app' | while read -r app; do
            ( cd "$(dirname "$app")" && ditto -c -k --keepParent "$(basename "$app")" "/tmp/app-bundle.zip" )
            cp /tmp/app-bundle.zip "out/${ARTIFACT}.app.zip"
          done

          # 统一改成 ASCII 文件名：GitHub 的 artifact / release 会吞掉中文，导致附件名残缺
          cd out
          for f in *.dmg;  do [ -e "$f" ] && mv -f "$f" "${ARTIFACT}.dmg"; done
          for f in *.msi;  do [ -e "$f" ] && mv -f "$f" "${ARTIFACT}.msi"; done
          for f in *-setup.exe; do [ -e "$f" ] && mv -f "$f" "${ARTIFACT}-setup.exe"; done

          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # push 到 main 且动了 tauri2/ 就发版；手动触发时看勾选
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(node -p "require('./tauri2/package.json').version")
          SHORT="${GITHUB_SHA:0:7}"

          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="shell-v${VERSION}"
          fi
          case "$TAG" in shell-v*) ;; *) TAG="shell-v${TAG}" ;; esac

          # 版本号没变却要发版（例如合并提交跳过了版本自增、或 --no-verify 提交），
          # 就把短 SHA 拼到标签上，避免把上一版 Release 的附件直接覆盖掉。
          if [ -z "${{ inputs.tag }}" ]; then
            EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null || true)
            if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "⚠️ 标签 ${TAG} 已指向 ${EXISTING_SHA:0:7}，改用带短 SHA 的标签"
              TAG="${TAG}-${SHORT}"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "解析结果：$TAG（tauri2 版本 $VERSION，提交 $SHORT）"

      - name: List assets
        shell: bash
        run: ls -lh dist

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT="${{ steps.meta.outputs.short }}"

          cat > notes.md <<EOF
          ## 发货控制台 v${VERSION}

          构建自提交 \`${SHORT}\`。Tauri 2 桌面壳：双击启动，自动检查环境 → 拉取业务代码 → 安装依赖 → 启动本地服务 → 打开网页。

          ### 下载

          | 平台 | 文件 |
          |------|------|
          | macOS（Apple Silicon + Intel） | macos-universal.dmg / macos-universal.app.zip |
          | Windows 10/11 x64 | windows-x64-setup.exe / windows-x64.msi（如可用） |

          ### 安装说明

          - **macOS**：安装包未做 Apple 公证。首次打开若提示「已损坏」或「无法验证开发者」，
            在终端执行 `xattr -dr com.apple.quarantine "/Applications/发货控制台.app"`，或右键 →「打开」。
          - **Windows**：未做代码签名，SmartScreen 可能提示，点「更多信息」→「仍要运行」。

          ### 说明

          - 应用本体不打包 Node.js，首次启动会检测环境，缺失时引导安装（winget / brew / apt）。
          - 业务代码首次启动自动下载到「应用数据目录/business」，之后点「检查更新」按需更新。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "发货控制台 v${VERSION}"
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" dist/* \
              --title "发货控制台 v${VERSION}" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url --jq .url
