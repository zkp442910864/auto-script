name: build

# 打包桌面壳（tauri2/）：
# - macOS：universal（Apple Silicon + Intel），产出 .app / .dmg
# - Windows：x86_64，产出 .msi / .exe（NSIS）
# 手动触发（Actions 页面 Run workflow）或打 v* tag 触发；产物在 workflow 的 Artifacts 里。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            artifact: macos-universal
          - platform: windows-latest
            args: ''
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri2/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 打通用包需要两个 target；Windows 用默认 host target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tauri2/src-tauri -> target'

      - name: Install frontend deps
        working-directory: tauri2
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: tauri2
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find tauri2/src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} out/ \;
          # macOS 的 .app 是目录，压成 zip 便于下载
          find tauri2/src-tauri/target -maxdepth 4 -type d -name '*.app' -exec sh -c 'cd "$(dirname "$1")" && ditto -c -k --keepParent "$(basename "$1")" "/tmp/$(basename "$1").zip"' _ {} \;
          cp /tmp/*.app.zip out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
